name: Backend CI

# Smoke-tests the backend security guards (Ghostscript sandbox, DOCX zip-bomb
# cap, Pillow pixel cap, Content-Disposition sanitization) plus endpoint
# regressions, on every PR and push that touches the backend.

on:
  pull_request:
    paths:
      - "main.py"
      - "compression.py"
      - "requirements*.txt"
      - "tests/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "main.py"
      - "compression.py"
      - "requirements*.txt"
      - "tests/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Ghostscript
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ghostscript

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run security smoke tests
        run: pytest -q
